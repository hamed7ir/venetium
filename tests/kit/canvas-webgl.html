<!doctype html>
<meta charset="utf-8">
<title>Venetium kit — canvas-webgl</title>
<style>
  #gallery { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0 6px; }
  #gallery figure { margin: 0; font: 11px Arial, sans-serif; max-width: 330px; }
  #gallery canvas { border: 1px solid #888; image-rendering: pixelated; background: #fff; display: block; }
</style>
<script src="lib/configs.js"></script>
<script src="lib/build.js"></script>
<script src="lib/kit.js"></script>
<script src="lib/canvas-webgl-model.js"></script>
<script src="data/canvas-webgl-golden.js"></script>
<script>
// BATCH-X86-2 §1 page canvas-webgl: 2D canvas with pixel checksums, WebGL 1 and WebGL 2.
//  * The 2D checks are real checks everywhere. The "exact" scene (lib/canvas-webgl-model.js) uses only integer, axis-aligned,
//    opaque drawing, so its pixels are predicted by an independent software model and by golden values made under Node
//    (data/canvas-webgl-golden.js): any difference is the canvas, or the JS engine running the model. Anti-aliased shapes, gradients,
//    blurs and text are checked with tolerances (or only reported), because those are backend / font dependent.
//  * WebGL: the requirement is per version and comes from the run (URL ?webgl=..., or window.KIT_BUILD.webgl from lib/build.js, written
//    by the packaging step), never from the browser under test: 'required' = WebGL 1 must exist (WebGL 2 is reported only: a GPU at
//    Direct3D feature level 9_x gives WebGL 1 but no WebGL 2); 'webgl2' = WebGL 1 and WebGL 2 must both exist; nothing = neither is
//    required. A missing context that is required is a failed check. A missing context that is not required is information
//    (Kit.info) and the page says so loudly: WebGL 1 missing (no WebGL at all) gets a RED banner, the info row "WebGL coverage" and
//    result.webglTested, so a PASS with skipped WebGL cannot be mistaken for a WebGL pass; WebGL 2 missing while WebGL 1 works gets a
//    GREY information banner only (normal, not a defect, and not red); a required version that is missing is red. An unrecognised
//    setting value is a failed check (a typo must not silently run unrequired). When a context exists it is checked for real:
//    strings, clear + readPixels, shaders (compile, link, active attribute and uniforms), textures, FBO, depth, blend, 2D-canvas interop.
//  * No V8 natives here: this page does not prove a tier (js-f1 / js-jit do); it feeds the JS engine integer pixel arithmetic.
(async () => {
  const timings = {}; let current = 'start';
  // `stopped` goes true when the result is published. main() can still be running then (a hung section, a late continuation); from
  // that moment the page's own Kit.check / Kit.info / Kit.na calls do nothing, so nothing is added to a result that is already out.
  let stopped = false;
  const KitReal = window.Kit;
  const Kit = Object.create(KitReal);
  Kit.check = (...a) => stopped ? false : KitReal.check(...a);
  Kit.info = (...a) => { if (!stopped) KitReal.info(...a); };
  Kit.na = (...a) => { if (!stopped) KitReal.na(...a); };
  if (!window.CW || !window.CW_GOLDEN) {   // a missing script file: report it instead of throwing at the first use of CW
    KitReal.check('page: its scripts loaded (lib/canvas-webgl-model.js, data/canvas-webgl-golden.js)', 'CW and CW_GOLDEN defined', 'CW is ' + typeof window.CW + ', CW_GOLDEN is ' + typeof window.CW_GOLDEN, false);
    await KitReal.done({ timings, webgl: {} });
    return;
  }
  const GOLD = window.CW_GOLDEN, CW = window.CW, W = CW.W, H = CW.H, hx = CW.hex;
  // does this run require WebGL? (a requirement of the run, not something the browser under test tells us)
  // 'required' = WebGL 1 required (WebGL 2 reported only); 'webgl2' = WebGL 1 and 2 required; absent = nothing required. The stricter of the
  // URL and lib/build.js wins; any other value is reported as a failed check below and ignored.
  const WEBGL_SOURCES = [['the URL ?webgl=', new URLSearchParams(location.search).get('webgl')], ['lib/build.js KIT_BUILD.webgl = ', KitReal.build ? KitReal.build.webgl : null]]
    .filter(s => s[1] !== null && s[1] !== undefined && s[1] !== '' && s[1] !== false);
  const WEBGL_SETTING = WEBGL_SOURCES.some(s => s[1] === 'webgl2') ? 'webgl2' : WEBGL_SOURCES.some(s => s[1] === 'required') ? 'required' : 'none';
  const WEBGL_FROM = WEBGL_SETTING === 'none' ? 'no requirement' : WEBGL_SOURCES.filter(s => s[1] === WEBGL_SETTING).map(s => s[0] + JSON.stringify(s[1])).join(' and ');
  const REQ = { 1: WEBGL_SETTING !== 'none', 2: WEBGL_SETTING === 'webgl2' };   // which WebGL versions this run requires
  const REQ_TEXT = { none: 'no WebGL version', required: 'WebGL 1 only (WebGL 2 is reported)', webgl2: 'WebGL 1 and WebGL 2' }[WEBGL_SETTING];
  const BAD_SETTINGS = WEBGL_SOURCES.filter(s => s[1] !== 'required' && s[1] !== 'webgl2');
  if (BAD_SETTINGS.length) Kit.check('the WebGL requirement setting is recognised', 'absent, "required" (WebGL 1) or "webgl2" (WebGL 1 and 2)', BAD_SETTINGS.map(s => s[0] + JSON.stringify(s[1])).join(', ') + ' (ignored: no WebGL version is required by it)', false);
  let bannerKind = 'none';   // 'none' | 'grey' | 'red': what glCoverage() showed at the top of the page
  const glTested = { 1: false, 2: false };   // true once a context of that version existed and its checks ran
  const T =(p, ms, what) => new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('timeout after ' + ms + ' ms: ' + what)), ms);
    p.then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
  });
  const near = (a, b, t) => a.length === b.length && a.every((v, i) => Math.abs(v - b[i]) <= t);
  const fmt = a => '(' + Array.from(a).join(',') + ')';
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const ctxOf = c => c.getContext('2d', { willReadFrequently: true });
  const px2 = (ctx, x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data);
  const loadImage = (src, ms) => T(new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image failed to load')); i.src = src; }), ms || 10000, 'image load');
  const toBlob = (c, type, q) => T(new Promise(res => c.toBlob(res, type, q)), 10000, 'toBlob ' + type);
  const magic = async b => Array.from(new Uint8Array(await b.slice(0, 12).arrayBuffer()));
  const hexs = a => a.map(v => ('0' + v.toString(16)).slice(-2)).join('');
  function diffPx(got, want) {
    let n = 0, first = null;
    for (let i = 0; i < want.length; i += 4) {
      if (got[i] !== want[i] || got[i + 1] !== want[i + 1] || got[i + 2] !== want[i + 2] || got[i + 3] !== want[i + 3]) {
        if (!n) first = { x: (i >> 2) % W, y: ((i >> 2) / W) | 0, got: fmt([got[i], got[i + 1], got[i + 2], got[i + 3]]), want: fmt([want[i], want[i + 1], want[i + 2], want[i + 3]]) };
        n++;
      }
    }
    return { n, first };
  }
  const diffText = d => d.n + ' differing pixel(s)' + (d.first ? ', first at (' + d.first.x + ',' + d.first.y + ') got ' + d.first.got + ' want ' + d.first.want : '');
  async function sec(name, fn) {
    if (stopped) return;
    current = name; const t = performance.now();
    try { await fn(); } catch (e) { Kit.check(name + ': ran without an exception', 'no exception', (e && e.name ? e.name + ': ' : '') + (e && e.message || e), false); }
    timings[name] = Math.round(performance.now() - t);
  }
  if (document.readyState === 'loading') await new Promise(r => document.addEventListener('DOMContentLoaded', r));
  const gallery = document.createElement('div'); gallery.id = 'gallery'; document.body.appendChild(gallery);
  function show(label, canvas, w, h) {
    const f = document.createElement('figure'); canvas.style.width = w + 'px'; canvas.style.height = h + 'px'; f.appendChild(canvas);
    const c = document.createElement('figcaption'); c.textContent = label; f.appendChild(c); gallery.appendChild(f); return canvas;
  }
  // Everything below runs under a page watchdog (see the end): a section that never returns must fail, not hang.
  async function main() {
    const ops = CW.scene();
    let modelPx = null, sceneCanvas = null;

    // ===================================================== 2D: the exact scene =====================================================
    await sec('reference model', async () => {
      const opsCrc = hx(CW.crcStr(JSON.stringify(ops)));
      Kit.check('scene generator reproduces the golden operation list (JS engine, no canvas)', GOLD.opsCrc + ' (' + GOLD.ops + ' ops)', opsCrc + ' (' + ops.length + ' ops)', opsCrc === GOLD.opsCrc && ops.length === GOLD.ops);
      const crcs = [];
      for (let i = 0; i < 3; i++) { modelPx = CW.model(ops); crcs.push(hx(CW.crc32(modelPx))); }
      Kit.check('reference model (software rasteriser in JS) reproduces the golden CRC32, 3 runs (JS engine, no canvas)', GOLD.crc, crcs.join(' '), crcs.every(c => c === GOLD.crc));
    });
    if (!modelPx) modelPx = CW.model(ops);

    await sec('2d exact scene', async () => {
      const cv = show('2D exact scene, default context (x2)', mk(W, H), W * 2, H * 2);
      const ctx = cv.getContext('2d');
      Kit.info('2D context attributes (default context)', ctx.getContextAttributes ? JSON.stringify(ctx.getContextAttributes()) : 'getContextAttributes missing');
      CW.render(ctx, ops);
      const d = ctx.getImageData(0, 0, W, H).data;
      const crc = hx(CW.crc32(d));
      const want = Kit.want(GOLD.crc, GOLD.crc.slice(0, 7) + (GOLD.crc[7] === '0' ? '1' : '0'));   // armed: the planted wrong expectation
      Kit.check('2D canvas (default context): CRC32 of the ' + W + 'x' + H + ' exact scene = golden', want, crc, crc === want);
      const df = diffPx(d, modelPx);
      Kit.check('2D canvas: every pixel of the exact scene equals the reference model (' + W * H + ' pixels, ' + GOLD.transparentPixels + ' transparent)', '0 differing pixel(s)', diffText(df), df.n === 0);
    });

    await sec('2d exact scene, software canvas', async () => {
      const cv = show('2D exact scene, willReadFrequently (x2)', mk(W, H), W * 2, H * 2);
      sceneCanvas = cv;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      CW.render(ctx, ops);
      const crc = hx(CW.crc32(ctx.getImageData(0, 0, W, H).data));
      Kit.check('2D canvas (willReadFrequently, software): CRC32 of the exact scene = golden', GOLD.crc, crc, crc === GOLD.crc);
      // a canvas reset (width = width) clears it, and drawing again gives the same bytes
      const w0 = cv.width; cv.width = w0;
      const cleared = px2(ctx, 80, 60).concat(px2(ctx, 0, 0));
      Kit.check('canvas.width = canvas.width clears the canvas (transparent black)', '(0,0,0,0)(0,0,0,0)', fmt(cleared.slice(0, 4)) + fmt(cleared.slice(4)), cleared.every(v => v === 0));
      CW.render(ctx, ops);
      const crc2 = hx(CW.crc32(ctx.getImageData(0, 0, W, H).data));
      Kit.check('after the reset the scene drawn again gives the golden CRC32', GOLD.crc, crc2, crc2 === GOLD.crc);
    });

    await sec('offscreen canvas', async () => {
      if (typeof OffscreenCanvas === 'undefined') { Kit.na('OffscreenCanvas exact scene', 'OffscreenCanvas is not defined in this browser'); return; }
      const oc = new OffscreenCanvas(W, H), ctx = oc.getContext('2d');
      if (!ctx) { Kit.check('OffscreenCanvas getContext("2d")', 'a context', 'null', false); return; }
      CW.render(ctx, ops);
      const crc = hx(CW.crc32(ctx.getImageData(0, 0, W, H).data));
      Kit.check('OffscreenCanvas (main thread): CRC32 of the exact scene = golden', GOLD.crc, crc, crc === GOLD.crc);
    });

    // ----- encode + decode round trips of the exact scene
    await sec('png round trip', async () => {
      const png = await toBlob(sceneCanvas, 'image/png');
      const mg = png ? await magic(png) : [];
      Kit.check('canvas.toBlob("image/png") yields a PNG', 'type image/png, bytes 89504e470d0a1a0a', (png ? png.type + ', ' + png.size + ' bytes, ' : 'null blob, ') + hexs(mg.slice(0, 8)), !!png && png.type === 'image/png' && hexs(mg.slice(0, 8)) === '89504e470d0a1a0a' && png.size > 200);
      const url = URL.createObjectURL(png);
      const im = await loadImage(url);
      const c = mk(W, H), x = ctxOf(c); x.drawImage(im, 0, 0);
      const crc = hx(CW.crc32(x.getImageData(0, 0, W, H).data));
      Kit.check('PNG blob: URL decoded by <img> and drawn back: CRC32 = golden (lossless round trip, incl. transparent holes)', GOLD.crc, crc + ' (' + im.naturalWidth + 'x' + im.naturalHeight + ')', crc === GOLD.crc && im.naturalWidth === W && im.naturalHeight === H);
      URL.revokeObjectURL(url);
      const du = sceneCanvas.toDataURL('image/png');
      const im2 = await loadImage(du);
      const c2 = mk(W, H), x2 = ctxOf(c2); x2.drawImage(im2, 0, 0);
      const crc2 = hx(CW.crc32(x2.getImageData(0, 0, W, H).data));
      Kit.check('toDataURL("image/png") decoded by <img> and drawn back: CRC32 = golden', GOLD.crc, crc2 + ' (data URL ' + du.length + ' chars)', crc2 === GOLD.crc && du.indexOf('data:image/png;base64,') === 0);
    });

    await sec('createImageBitmap', async () => {
      const bmp = await T(createImageBitmap(sceneCanvas), 10000, 'createImageBitmap');
      const c = mk(W, H), x = ctxOf(c); x.drawImage(bmp, 0, 0);
      const crc = hx(CW.crc32(x.getImageData(0, 0, W, H).data));
      Kit.check('createImageBitmap(canvas) drawn back: CRC32 = golden', GOLD.crc, crc + ' (' + bmp.width + 'x' + bmp.height + ')', crc === GOLD.crc && bmp.width === W && bmp.height === H);
      if (bmp.close) bmp.close();
    });

    // ----- lossy encoders: a JPEG-friendly picture, tolerance on the mean absolute error
    await sec('lossy encoders', async () => {
      const w = 128, h = 96, src = mk(w, h), s = ctxOf(src);
      const quad = [['rgb(200,40,40)', 0, 0], ['rgb(40,200,40)', 64, 0], ['rgb(40,40,200)', 0, 36], ['rgb(220,220,60)', 64, 36]];
      for (const [c, x, y] of quad) { s.fillStyle = c; s.fillRect(x, y, 64, 36); }
      const g = s.createLinearGradient(0, 0, w, 0); g.addColorStop(0, '#000'); g.addColorStop(1, '#fff'); s.fillStyle = g; s.fillRect(0, 72, w, 24);
      const ref = s.getImageData(0, 0, w, h).data;
      function mae(d) { let sum = 0, mx = 0; for (let i = 0; i < ref.length; i += 4) for (let k = 0; k < 3; k++) { const e = Math.abs(d[i + k] - ref[i + k]); sum += e; if (e > mx) mx = e; } return { mae: sum / (w * h * 3), max: mx }; }
      for (const [type, q, sig, limit] of [['image/jpeg', 0.92, 'ffd8ff', 4], ['image/webp', 0.9, '52494646', 4]]) {
        const b = await toBlob(src, type, q);
        if (!b || b.type !== type) { Kit.info('toBlob(' + type + ') encoder', 'not provided: got ' + (b ? b.type : 'null') + ' (falls back to PNG)'); continue; }
        const m = await magic(b);
        const sigOk = hexs(m).indexOf(sig) === 0 && (type !== 'image/webp' || hexs(m.slice(8, 12)) === '57454250');
        Kit.check('toBlob(' + type + ') yields a valid container', 'signature ' + sig + (type === 'image/webp' ? '..57454250' : ''), hexs(m) + ', ' + b.size + ' bytes', sigOk && b.size > 100);
        const url = URL.createObjectURL(b); const im = await loadImage(url); URL.revokeObjectURL(url);
        const c = mk(w, h), x = ctxOf(c); x.drawImage(im, 0, 0);
        const r = mae(x.getImageData(0, 0, w, h).data);
        Kit.check(type + ' encode + decode: mean absolute RGB error (picture of flat blocks and a gradient, quality ' + q + ')', '<= ' + limit + ', size ' + w + 'x' + h, r.mae.toFixed(2) + ' (max ' + r.max + '), ' + im.naturalWidth + 'x' + im.naturalHeight + ', ' + b.size + ' bytes', r.mae <= limit && im.naturalWidth === w && im.naturalHeight === h);
      }
    });

    // ===================================================== 2D: tolerance checks (anti-aliasing, blends, gradients) ================
    await sec('2d blends', async () => {
      let c = mk(8, 8), x = ctxOf(c);
      x.fillStyle = '#fff'; x.fillRect(0, 0, 8, 8); x.fillStyle = 'rgba(255,0,0,0.5)'; x.fillRect(0, 0, 8, 8);
      let p = px2(x, 3, 3);
      Kit.check('source-over: rgba(255,0,0,0.5) over opaque white', '(255,128,128,255) +-1', fmt(p), near(p, [255, 128, 128, 255], 1));
      x.clearRect(0, 0, 8, 8); x.globalAlpha = 0.25; x.fillStyle = '#000'; x.fillRect(0, 0, 8, 8); p = px2(x, 3, 3);
      Kit.check('globalAlpha 0.25 black on transparent: alpha 64 +-1, colour black', '(0,0,0,64) +-1', fmt(p), near(p, [0, 0, 0, 64], 1));
      // xor
      c = mk(40, 40); x = ctxOf(c);
      x.fillStyle = 'rgb(255,0,0)'; x.fillRect(0, 0, 20, 20); x.globalCompositeOperation = 'xor'; x.fillStyle = 'rgb(0,255,0)'; x.fillRect(10, 10, 20, 20);
      let r = [px2(x, 5, 5), px2(x, 15, 15), px2(x, 25, 25), px2(x, 35, 35)];
      Kit.check('composite xor: red | overlap | green | outside', '(255,0,0,255) (0,0,0,0) (0,255,0,255) (0,0,0,0)', r.map(fmt).join(' '), near(r[0], [255, 0, 0, 255], 0) && near(r[1], [0, 0, 0, 0], 0) && near(r[2], [0, 255, 0, 255], 0) && near(r[3], [0, 0, 0, 0], 0));
      // destination-out and destination-over
      c = mk(20, 20); x = ctxOf(c);
      x.fillStyle = 'rgb(255,0,0)'; x.fillRect(0, 0, 10, 20); x.globalCompositeOperation = 'destination-over'; x.fillStyle = 'rgb(0,0,255)'; x.fillRect(0, 0, 20, 20);
      r = [px2(x, 5, 5), px2(x, 15, 5)];
      Kit.check('composite destination-over: red stays on top where it is, blue behind elsewhere', '(255,0,0,255) (0,0,255,255)', r.map(fmt).join(' '), near(r[0], [255, 0, 0, 255], 0) && near(r[1], [0, 0, 255, 255], 0));
      x.globalCompositeOperation = 'destination-out'; x.fillStyle = '#000'; x.fillRect(0, 0, 10, 20); r = [px2(x, 5, 5), px2(x, 15, 5)];
      Kit.check('composite destination-out: the covered half is erased, the rest stays', '(0,0,0,0) (0,0,255,255)', r.map(fmt).join(' '), near(r[0], [0, 0, 0, 0], 0) && near(r[1], [0, 0, 255, 255], 0));
      // lighter and multiply
      c = mk(8, 8); x = ctxOf(c);
      x.fillStyle = 'rgb(100,50,0)'; x.fillRect(0, 0, 8, 8); x.globalCompositeOperation = 'lighter'; x.fillStyle = 'rgb(100,100,100)'; x.fillRect(0, 0, 8, 8); p = px2(x, 4, 4);
      Kit.check('composite lighter: (100,50,0) + (100,100,100)', '(200,150,100,255) +-1', fmt(p), near(p, [200, 150, 100, 255], 1));
      c = mk(8, 8); x = ctxOf(c);
      x.fillStyle = 'rgb(128,128,128)'; x.fillRect(0, 0, 8, 8); x.globalCompositeOperation = 'multiply'; x.fillStyle = 'rgb(128,128,128)'; x.fillRect(0, 0, 8, 8); p = px2(x, 4, 4);
      Kit.check('composite multiply: 128 x 128 / 255', '(64,64,64,255) +-1', fmt(p), near(p, [64, 64, 64, 255], 1));
    });

    await sec('2d shadows and filters', async () => {
      let c = mk(80, 80), x = ctxOf(c);
      x.shadowColor = 'rgb(255,0,0)'; x.shadowOffsetX = 10; x.shadowOffsetY = 5; x.shadowBlur = 0; x.fillStyle = 'rgb(0,0,255)'; x.fillRect(20, 20, 30, 30);
      let r = [px2(x, 25, 25), px2(x, 55, 53), px2(x, 58, 30), px2(x, 15, 15), px2(x, 25, 52)];
      Kit.check('shadow without blur, offset (10,5): blue box, red shadow right and below, nothing outside', '(0,0,255,255) (255,0,0,255) (255,0,0,255) (0,0,0,0) (0,0,0,0)', r.map(fmt).join(' '),
        near(r[0], [0, 0, 255, 255], 0) && near(r[1], [255, 0, 0, 255], 0) && near(r[2], [255, 0, 0, 255], 0) && near(r[3], [0, 0, 0, 0], 0) && near(r[4], [0, 0, 0, 0], 0));
      c = mk(100, 100); x = ctxOf(c);
      x.shadowColor = 'rgb(0,0,0)'; x.shadowBlur = 10; x.fillStyle = 'rgb(255,255,255)'; x.fillRect(30, 30, 40, 40);
      const a = (px, py) => px2(x, px, py)[3];
      const near3 = a(27, 50), far = a(5, 50), sym = [Math.abs(a(29 - 2, 50) - a(70 + 2, 50)), Math.abs(a(50, 29 - 2) - a(50, 70 + 2))];
      Kit.check('shadowBlur 10: soft edge 3 px outside the box (alpha 20..180), nothing 25 px away, left/right and top/bottom symmetric (+-2)', 'alpha 20..180, 0, symmetric', 'alpha ' + near3 + ', ' + far + ', asym ' + sym.join('/'), near3 >= 20 && near3 <= 180 && far === 0 && sym[0] <= 2 && sym[1] <= 2);
      if (!('filter' in x)) { Kit.na('ctx.filter', 'CanvasRenderingContext2D.filter is not available in this browser'); return; }
      c = mk(20, 20); x = ctxOf(c);
      x.filter = 'invert(1)'; x.fillStyle = 'rgb(10,20,30)'; x.fillRect(2, 2, 16, 16); x.filter = 'none';
      const p = px2(x, 10, 10), q = px2(x, 0, 0);
      Kit.check('ctx.filter = invert(1) on a (10,20,30) box', '(245,235,225,255) +-2 inside, (0,0,0,0) outside', fmt(p) + ' ' + fmt(q), near(p, [245, 235, 225, 255], 2) && near(q, [0, 0, 0, 0], 0));
      c = mk(60, 60); x = ctxOf(c);
      x.filter = 'blur(4px)'; x.fillStyle = '#000'; x.fillRect(20, 20, 20, 20); x.filter = 'none';
      const edge = px2(x, 20, 30)[3], mid = px2(x, 30, 30)[3], out = px2(x, 2, 30)[3];
      Kit.check('ctx.filter = blur(4px): box centre opaque, edge half-covered (alpha 60..200), 18 px away empty', 'centre >= 240, edge 60..200, away 0', 'centre ' + mid + ', edge ' + edge + ', away ' + out, mid >= 240 && edge >= 60 && edge <= 200 && out === 0);
    });

    await sec('2d anti-aliased shapes', async () => {
      const c = mk(80, 80), x = ctxOf(c);
      x.fillStyle = '#000'; x.beginPath(); x.arc(40, 40, 30, 0, Math.PI * 2); x.fill();
      const d = x.getImageData(0, 0, 80, 80).data; let area = 0, asymH = 0, asymV = 0;
      for (let y = 0; y < 80; y++) for (let xx = 0; xx < 80; xx++) {
        const al = d[(y * 80 + xx) * 4 + 3]; area += al / 255;
        asymH = Math.max(asymH, Math.abs(al - d[(y * 80 + 79 - xx) * 4 + 3])); asymV = Math.max(asymV, Math.abs(al - d[((79 - y) * 80 + xx) * 4 + 3]));

        const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex); gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 2, 2); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, T2); texParams();
        drawTex(tex);
        checkQuadrants('texStorage2D + texSubImage2D (immutable 2x2 RGBA8 texture): every pixel is its texel');
      });
    }
    await gt('final picture', () => {   // leave something to look at in the screenshot: the 2x2 quadrant texture
      const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, T2); texParams(); drawTex(tex);
    });
    await gt('no GL errors', () => {
      Kit.check(name + 'no GL error was raised by any of the calls above (getError after every step)', 'none', errs.length ? errs.join(' ') : 'none', errs.length === 0);
    });
    // context loss and restore, on a second context so that the picture above stays
    await gt('context loss', async () => {
      const c = mk(4, 4); c.style.display = 'none'; document.body.appendChild(c);
      const g2 = c.getContext(ver === 2 ? 'webgl2' : 'webgl', GLATTR);
      if (!g2) { Kit.info(name + 'second context for the loss test', 'could not be created'); return; }
      const ext = g2.getExtension('WEBGL_lose_context');
      if (!ext) { Kit.info(name + 'WEBGL_lose_context', 'extension not available: context loss not exercised'); return; }
      const ev = (n, pd) => T(new Promise(res => c.addEventListener(n, e => { if (pd) e.preventDefault(); res(); }, { once: true })), 15000, 'event ' + n);   // preventDefault in the same listener: restoreContext() is only allowed once the loss event was cancelled
      const lost = ev('webglcontextlost', true);
      ext.loseContext(); await lost;
      await Kit.sleep(20);   // Blink sets 'restore allowed' only after the loss event's dispatch has returned: restoreContext() from the handler itself is refused
      const wasLost = g2.isContextLost();
      const restored = ev('webglcontextrestored'); ext.restoreContext(); await restored;
      g2.clearColor(1, 0, 0, 1); g2.clear(g2.COLOR_BUFFER_BIT); const a = new Uint8Array(4); g2.readPixels(0, 0, 1, 1, g2.RGBA, g2.UNSIGNED_BYTE, a);
      Kit.check(name + 'loseContext() -> webglcontextlost, isContextLost() true; restoreContext() -> webglcontextrestored, usable again (clear red reads red)', 'lost=true, restored, (255,0,0,255)', 'lost=' + wasLost + ', isContextLost after restore=' + g2.isContextLost() + ', ' + fmt(a), wasLost === true && !g2.isContextLost() && near(Array.from(a), [255, 0, 0, 255], 1));
      c.remove();
    });
  }

  // The whole page runs under a watchdog: a hang is a failed check, not a hang. A throw that escapes every sec() / gt() (the scene
  // generator, a failed setup) is a failed check as well, and the page still publishes what it has.
  let settled = false, wd = null;
  const m = main().then(() => {}, e => {
    Kit.check('page: uncaught exception in section ' + current, 'no exception', (e && e.name ? e.name + ': ' : '') + (e && e.message || e), false);
  }).then(() => { settled = true; });
  const watchdog = new Promise(res => { wd = setTimeout(res, 45000); });
  await Promise.race([m, watchdog]);
  clearTimeout(wd);
  if (!settled) Kit.check('the page finished within 45 s', 'finished', 'still running in section "' + current + '"', false);
  stopped = true;   // main() may still be running (hung section): from here on it adds nothing to the published result
  await KitReal.done({ timings, webgl: glInfo, webglTested: glTested, webglRequired: REQ, webglSetting: WEBGL_SETTING, webglBanner: bannerKind, model: { crc: GOLD.crc, ops: GOLD.ops } });
})().catch(async e => {   // a throw before main() (the page's own setup): still a failed check and a published result, never a silent hang
  try { window.Kit.check('page: uncaught exception in the page setup', 'no exception', (e && e.name ? e.name + ': ' : '') + (e && e.message || e), false); } catch (x) { /* nothing more to do */ }
  try { await window.Kit.done({}); } catch (x) { /* nothing more to do */ }
});
